<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Chili3D · ExternalSoul runtime</title>
        <link rel="icon" href="favicon.svg">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
        <link rel="stylesheet" type="text/css" href="index.css" />
        <style>
            /* ExternalSoul's palettes over Chili3D's theme variables (html:root beats :root[theme] by one element). */
            html:root[theme="light"] {
                --background-color: #efe9dd;
                --panel-background-color: #f7f2e9;
                --panel-hover-background-color: #efe8dc;
                --control-background-color: #fbf8f2;
                --titlebar-background-color: #e9e2d5;
                --titlebar-forground-color: #2b2620;
                --statusbar-background-color: #e9e2d5;
                --statusbar-foreground-color: #5c544a;
                --viewport-background-color: #d9d2c4;
                --foreground-color: #2b2620;
                --foreground-secondary-color: #6b6257;
                --foreground-muted-color: #9c9286;
                --border-color: #d9d2c5;
                --border-hover-color: #c3bbac;
                --primary-color: #b45309;
                --secondary-color: #d08a3e;
                --button-primary-background: #b45309;
                --button-primary-hover: #9a4607;
                --button-secondary-background: #fbf8f2;
                --button-secondary-hover: #f1ebe0;
                --input-background-color: #fffdf9;
                --input-border-color: #d9d2c5;
                --input-text-color: #2b2620;
                --hover-background-color: rgba(70, 48, 22, 0.08);
                --active-background-color: rgba(70, 48, 22, 0.14);
                --checked-color: rgba(70, 48, 22, 0.12);
                --title-background: rgba(70, 48, 22, 0.07);
                --title-checked: #f7f2e9;
                --panel-shadow: 0 2px 10px rgba(60, 40, 20, 0.12);
                --loading-border-color: rgba(60, 40, 20, 0.2);
            }
            html:root[theme="dark"] {
                --background-color: #1c1917;
                --panel-background-color: #232020;
                --panel-hover-background-color: #2c2826;
                --control-background-color: #2a2624;
                --titlebar-background-color: #1a1715;
                --titlebar-forground-color: #ece7df;
                --statusbar-background-color: #1a1715;
                --statusbar-foreground-color: #b8b0a4;
                --viewport-background-color: #26221f;
                --foreground-color: #ece7df;
                --foreground-secondary-color: #b8b0a4;
                --foreground-muted-color: #857c71;
                --border-color: #3b3532;
                --border-hover-color: #4d453f;
                --primary-color: #e0a060;
                --secondary-color: #d08a3e;
                --button-primary-background: #c97a2f;
                --button-primary-hover: #b86a22;
                --button-secondary-background: #2a2624;
                --button-secondary-hover: #332e2b;
                --input-background-color: #211e1c;
                --input-border-color: #3b3532;
                --input-text-color: #ece7df;
                --hover-background-color: rgba(255, 240, 220, 0.1);
                --active-background-color: rgba(255, 240, 220, 0.16);
                --checked-color: rgba(255, 240, 220, 0.14);
                --title-background: rgba(255, 240, 220, 0.07);
                --title-checked: rgba(255, 240, 220, 0.2);
                --panel-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
                --loading-border-color: rgba(255, 240, 220, 0.2);
            }
            html, body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
            /* Chrome that belongs to the standalone app, not to a surface inside ExternalSoul. */
            #appName, a[href*="github.com/xiangechen"] { display: none !important; }
        </style>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
    </body>
</html>
