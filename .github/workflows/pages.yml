# Builds the esoul runtime (and the stock Chili3D app) and publishes dist/ to GitHub Pages.
# The published runtime is what the ExternalSoul CAD app embeds as a sandboxed iframe.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NODE_ENV: production
      # The runtime's own contract tests against the build that is about to be published: a runtime that breaks
      # the bridge (URL inputs, chunked exports, describe) or a CAD scenario never reaches a user's tab.
      - run: npm run test:runtime
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
